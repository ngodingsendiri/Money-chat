name: Record Roborazzi goldens (temporary)

# TEMPORARY: regenerate snapshot golden files on the exact CI runner (ubuntu +
# Temurin JDK 21) so verifyRoborazziDebug passes in CI. The old goldens were
# recorded with Android Studio JBR fonts and differ from CI rendering.
# After this runs once, delete this workflow.

on:
  workflow_dispatch:
  push:
    branches: [golden-regen]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Record snapshots
        run: ./gradlew :app:recordRoborazziDebug --no-daemon

      - name: Commit regenerated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "chore: regenerate Roborazzi goldens on CI runner (ubuntu + Temurin JDK 21)"
            git push
          fi
