name: Build APK

# Menghasilkan APK Money Chat v1 dari GitHub.
# - APK debug (langsung bisa diinstall) selalu dibuat dan diunggah sebagai artifact.
# - APK release (ditandatangani) otomatis dibuat kalau secrets keystore disiapkan:
#     KEYSTORE_BASE64    -> isi file keystore (.jks) dalam base64
#     KEYSTORE_PASSWORD  -> password keystore (STORE_PASSWORD)
#     KEY_PASSWORD       -> password key (alias "upload")
# Artifact diunduh dari tab Actions -> workflow terbaru -> Artifacts.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate debug keystore
        # app/build.gradle.kts menandatangani build debug dengan ${rootDir}/debug.keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyChat-v1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release APK (jika secrets keystore diset)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Keystore secrets belum diset — APK release dilewati (APK debug tetap tersedia)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload release APK (jika ada)
        uses: actions/upload-artifact@v4
        with:
          name: MoneyChat-v1.0.0-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
